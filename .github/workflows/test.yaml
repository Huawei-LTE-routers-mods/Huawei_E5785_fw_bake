name: Bake Complete E5785 Firmware (Both Variants)

on:
  workflow_dispatch:
    inputs:
      firmware_asset:
        description: 'Select original firmware to download from release 1.0.0'
        required: true
        default: 'E5785Lh-92a_UPDATE_21.191.63.03.375_WEBUI_21.100.52.06.375_NE5.bin'
        type: choice
        options:
          - E5785Lh-92a_UPDATE_21.191.63.03.375_WEBUI_21.100.52.06.375_NE5.bin
          - E5785Lh-92a_UPDATE_21.191.63.03.1133_WEBUI_21.100.52.06.1133_NE5.bin
          # Add more filenames here if you upload additional firmware files to release 1.0.0
          # - another_firmware_file.bin

permissions:
  contents: write

jobs:
  bake:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - variant: "zlib"
            flag: "--zlib"
            suffix: "zlib"
          - variant: "nozlib"
            flag: ""
            suffix: "nozlib"

    steps:
      - name: Checkout firmware baking repository
        uses: actions/checkout@v4

      - name: Set up Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Download original firmware from GitHub Release
        run: |
          curl -fL --retry 3 \
            'https://github.com/saqie1393/Huawei_E5785_fw_bake/releases/download/1.0.0/${{ github.event.inputs.firmware_asset }}' \
            -o E5785_original.bin
          test -s E5785_original.bin
          ls -lh E5785_original.bin

      - name: Download qhuaweiflash-cli
        run: |
          curl -fL --retry 3 \
            'https://github.com/saqie1393/qhuaweiflash/releases/download/cli-v1.0.0/qhuaweiflash-cli' \
            -o qhuaweiflash-cli
          chmod +x qhuaweiflash-cli

      - name: Install Qt5 runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libqt5widgets5 libqt5core5a libqt5gui5 libqt5dbus5 libqt5network5

      - name: List partitions in original firmware
        run: |
          ./qhuaweiflash-cli info E5785_original.bin
          ./qhuaweiflash-cli list E5785_original.bin

      - name: Extract System and APP partitions
        run: |
          ./qhuaweiflash-cli extract E5785_original.bin 0x00590000 System.E5785.orig.bin
          ./qhuaweiflash-cli extract E5785_original.bin 0x005a0000 APP.E5785.orig.bin
          test -s System.E5785.orig.bin
          test -s APP.E5785.orig.bin
          ls -lh System.E5785.orig.bin APP.E5785.orig.bin

      - name: Bake modified partitions
        run: |
          test -f baker.py
          python3 baker.py
          test -s System.E5785.bin
          test -s APP.E5785.bin
          ls -lh System.E5785.bin APP.E5785.bin
          sha256sum System.E5785.orig.bin System.E5785.bin APP.E5785.orig.bin APP.E5785.bin

      - name: Replace partitions and save final firmware (${{ matrix.variant }})
        run: |
          OUTPUT_FILE="E5785_92a_modified_21.191.63.03.375_${{ matrix.suffix }}.bin"

          ./qhuaweiflash-cli replace E5785_original.bin 0x00590000 System.E5785.bin temp1.bin ${{ matrix.flag }}
          ./qhuaweiflash-cli replace temp1.bin 0x005a0000 APP.E5785.bin temp2.bin ${{ matrix.flag }}

          WEBUI_FILE="webui/WEBUI.E5785.bin"
          if [ -f "$WEBUI_FILE" ]; then
            ./qhuaweiflash-cli replace temp2.bin 0x005b0000 "$WEBUI_FILE" "$OUTPUT_FILE" ${{ matrix.flag }}
          else
            echo "WARNING: $WEBUI_FILE not found, skipping WEBUI replace"
            cp temp2.bin "$OUTPUT_FILE"
          fi

          test -s "$OUTPUT_FILE"
          ls -lh "$OUTPUT_FILE"
          sha256sum E5785_original.bin "$OUTPUT_FILE"

      - name: Verify final firmware (${{ matrix.variant }})
        run: |
          OUTPUT_FILE="E5785_92a_modified_21.191.63.03.375_${{ matrix.suffix }}.bin"
          ./qhuaweiflash-cli info "$OUTPUT_FILE"
          ./qhuaweiflash-cli list "$OUTPUT_FILE"

      - name: Upload final firmware artifact (${{ matrix.variant }})
        uses: actions/upload-artifact@v4
        with:
          name: E5785-Final-Firmware-${{ matrix.suffix }}
          if-no-files-found: error
          path: E5785_92a_modified_21.191.63.03.375_${{ matrix.suffix }}.bin

      - name: Upload final firmware to GitHub Release (${{ matrix.variant }})
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v21.191.63.03.375-custom
          name: "Modified Firmware E5785 21.191.63.03.375"
          body: |
            Custom baked firmware with modified System, APP, and WebUI partitions.
            
            Two variants are available:
            - `_zlib.bin` — compressed partitions (smaller file, recommended)
            - `_nozlib.bin` — uncompressed partitions (larger file)
          files: E5785_92a_modified_21.191.63.03.375_${{ matrix.suffix }}.bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
