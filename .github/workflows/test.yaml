name: Bake Complete E5785 Firmware

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bake:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout firmware baking repository
        uses: actions/checkout@v4

      - name: Set up Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Download original firmware from GitHub Release
        run: |
          curl -fL --retry 3 \
            'https://github.com/saqie1393/Huawei_E5785_fw_bake/releases/download/1.0.0/E5785Lh-92a_UPDATE_21.191.63.03.375_WEBUI_21.100.52.06.375_NE5.bin' \
            -o E5785_original.bin
          test -s E5785_original.bin
          ls -lh E5785_original.bin

      - name: Download qhuaweiflash-cli
        run: |
          curl -fL --retry 3 \
            'https://github.com/saqie1393/qhuaweiflash/releases/download/cli-v1.0.0/qhuaweiflash-cli' \
            -o qhuaweiflash-cli
          chmod +x qhuaweiflash-cli

      - name: Install Qt5 runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libqt5widgets5 libqt5core5a libqt5gui5 libqt5dbus5 libqt5network5

      - name: List partitions in E5785 firmware
        run: |
          ./qhuaweiflash-cli info E5785_original.bin
          ./qhuaweiflash-cli list E5785_original.bin

      - name: Extract System and APP as .orig.bin
        run: |
          ./qhuaweiflash-cli extract E5785_original.bin 0x00590000 System.E5785.orig.bin
          ./qhuaweiflash-cli extract E5785_original.bin 0x005a0000 APP.E5785.orig.bin
          test -s System.E5785.orig.bin
          test -s APP.E5785.orig.bin
          ls -lh System.E5785.orig.bin APP.E5785.orig.bin

      - name: Bake modified partitions
        run: |
          test -f baker.py
          python3 baker.py
          test -s System.E5785.bin
          test -s APP.E5785.bin
          ls -lh System.E5785.bin APP.E5785.bin
          sha256sum System.E5785.orig.bin System.E5785.bin APP.E5785.orig.bin APP.E5785.bin

      - name: Replace System, APP, WebUI and save final firmware
        run: |
          ./qhuaweiflash-cli replace E5785_original.bin 0x00590000 System.E5785.bin temp1.bin
          ./qhuaweiflash-cli replace temp1.bin 0x005a0000 APP.E5785.bin temp2.bin

          if [ -f WEBUI.E5785.bin ]; then
            ./qhuaweiflash-cli replace temp2.bin 0x005b0000 WEBUI.E5785.bin E5785_92a_modified_21.191.63.03.375.bin
          else
            cp temp2.bin E5785_92a_modified_21.191.63.03.375.bin
          fi

          test -s E5785_92a_modified_21.191.63.03.375.bin
          ls -lh E5785_92a_modified_21.191.63.03.375.bin
          sha256sum E5785_original.bin E5785_92a_modified_21.191.63.03.375.bin

      - name: Verify final firmware
        run: |
          ./qhuaweiflash-cli info E5785_92a_modified_21.191.63.03.375.bin
          ./qhuaweiflash-cli list E5785_92a_modified_21.191.63.03.375.bin

      - name: Upload final firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: E5785-Final-Firmware
          if-no-files-found: error
          path: E5785_92a_modified_21.191.63.03.375.bin

      - name: Upload final firmware to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v21.191.63.03.375-custom
          name: "Modified Firmware E5785 21.191.63.03.375"
          body: "Custom baked firmware with modified System, APP, and WebUI partitions."
          files: E5785_92a_modified_21.191.63.03.375.bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
